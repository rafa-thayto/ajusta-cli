name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke-test the built binary
        run: |
          node dist/index.js --version
          node dist/index.js --help > /dev/null
          AJUSTA_NO_UPDATE_CHECK=1 node dist/index.js order wait --json 2>err.json; test $? -eq 2
          grep -q '"code":"missing_order_id"' err.json
